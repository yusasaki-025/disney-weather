<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>マイハマびより</title>
    <meta name="description" content="舞浜 (TDL ・ TDS) の天気予報を比較してショー ・ パレード中止リスクを判定" />
    <meta name="theme-color" content="#4A90D2" />
    <!-- §0.46.12 : 文字サイズ設定を描画前に復元 (拡大率のちらつき防止) -->
    <script>
      try {
        document.documentElement.dataset.fontSize = localStorage.getItem('fontSize') || 'small';
      } catch (e) {
        document.documentElement.dataset.fontSize = 'small';
      }
    </script>

    <!-- favicon ・ アイコン -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OGP / Twitter Card -->
    <meta property="og:title" content="マイハマびより" />
    <meta property="og:description" content="舞浜の天気からショー ・ パレード中止リスクを予測" />
    <meta property="og:image" content="https://disney-weather.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://disney-weather.pages.dev" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap"
    />
    <!-- 本文 ・ 見出し ・ 数値すべて Noto Sans JP に統一 (未読込時は system fallback) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <!-- Cowork artifact 許可 CDN : Chart.js v4.5.0 (UMD global Chart)。§0.4 -->
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"
      integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <img src="/logo-mark.svg" alt="マイハマびより" class="logo-mark" width="32" height="32" />
        <div class="app-title-text">
          <h1>マイハマびより</h1>
          <p class="app-subtitle"><span class="subtitle-full">舞浜の天気からショー ・ パレード中止リスクを予測</span><span class="subtitle-short">舞浜のショー ・ パレード中止予測</span></p>
        </div>
      </div>
      <div class="header-actions">
        <div class="fontsize-control" role="radiogroup" aria-label="文字サイズ">
          <span class="material-symbols-rounded fontsize-icon" aria-hidden="true">text_increase</span>
          <button type="button" class="fontsize-btn" data-size="small" role="radio" aria-checked="true" aria-label="文字サイズ 小">小</button>
          <button type="button" class="fontsize-btn" data-size="medium" role="radio" aria-checked="false" aria-label="文字サイズ 中">中</button>
          <button type="button" class="fontsize-btn" data-size="large" role="radio" aria-checked="false" aria-label="文字サイズ 大">大</button>
        </div>
        <button id="btn-refresh" class="btn" type="button">
          <span class="material-symbols-rounded" aria-hidden="true">refresh</span><span id="refresh-label">更新</span>
        </button>
        <button id="btn-help" class="btn" type="button" aria-label="ヘルプ">
          <span class="material-symbols-rounded" aria-hidden="true">help</span><span class="btn-label-text">ヘルプ</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section id="controls" aria-label="表示の絞り込みと並び替え">
        <label class="check check-recommend">
          <input type="checkbox" id="only-good" aria-label="おすすめ日のみ表示" />
          <span class="material-symbols-rounded" aria-hidden="true">star</span><span>おすすめ日のみ</span>
        </label>
        <div class="control-group" role="group" aria-label="並び順">
          <span class="control-label">並び順</span>
          <div class="seg" id="sort-seg">
            <button class="seg-btn" data-sort="date" type="button">日付順</button>
            <button class="seg-btn" data-sort="score" type="button">スコア順</button>
          </div>
        </div>
        <div class="control-group" role="group" aria-label="曜日フィルター">
          <span class="control-label">曜日</span>
          <div class="seg" id="dayfilter-seg">
            <button class="seg-btn" data-dayfilter="all" type="button">すべて</button>
            <button class="seg-btn" data-dayfilter="weekday" type="button"><span class="label-long">平日のみ</span><span class="label-short">平日</span></button>
            <button class="seg-btn" data-dayfilter="holiday" type="button"><span class="label-long">土日祝のみ</span><span class="label-short">土日祝</span></button>
          </div>
        </div>
        <button id="btn-refresh-mobile" class="btn btn-primary refresh-mobile" type="button">
          <span class="material-symbols-rounded" aria-hidden="true">refresh</span>天気データを更新 ・ <span id="refresh-label-mobile">今</span>
        </button>
      </section>

      <section id="table-section" aria-label="候補日の予報比較">
        <div class="table-scroll">
          <table id="forecast-table" class="forecast-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="legend" id="legend"></p>
      </section>

      <div id="score-legend" class="score-legend"></div>

      <section id="top3-section" aria-labelledby="top3-heading">
        <h2 id="top3-heading">14日のうちベスト3</h2>
        <div id="top3" class="top3-grid"></div>
      </section>
    </main>

    <footer role="contentinfo" class="disclaimer">
      <p class="app-footer-link">
        <a href="/accuracy.html"><span class="material-symbols-rounded" aria-hidden="true">analytics</span>予報精度を見る</a>
      </p>
      本ツールは公開予報からの推定であり、運営の公式発表ではありません。当日の正確な運営状況は東京ディズニーリゾート公式サイト ･ アプリで必ずご確認ください。
    </footer>

    <div id="error-screen" class="error-screen" hidden>
      <span class="material-symbols-rounded" aria-hidden="true">cloud_off</span>
      <p id="error-text">予報を取得できませんでした。ネットワークを確認してから更新してください。</p>
      <button id="btn-retry-all" class="btn" type="button">再試行</button>
    </div>


    <div id="help-modal" class="modal" hidden>
      <div class="modal-card modal-card-wide" role="dialog" aria-modal="true" aria-label="用語集とヘルプ">
        <button id="help-close" class="modal-close" type="button" aria-label="閉じる">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
        <div id="help-body" class="help-body"></div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
